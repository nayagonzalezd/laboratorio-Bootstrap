<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Personal</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>


    <div class="container-fluid">

  
        <div class="text-center mt-4 mb-4">
            <h1>Mi Tarjeta Personal</h1>
    
        </div>

      
        <div class="d-flex justify-content-center gap-2 mb-5">
            <button class="btn btn-primary">Botón 1</button>
            <button class="btn btn-success">Botón 2</button>
            <button class="btn btn-danger">Botón 3</button>
        </div>

        <!-- Ejercicio de alineación de texto -->
        <div class="mb-5">

            <p class="text-start">
                Izquierda
            </p>

            <p class="text-center text-danger">
                Centro
            </p>

            <p class="text-end">
                Derecha
            </p>

        </div>

  
        <div class="d-flex justify-content-center">

            <div class="card shadow-sm" style="width: 18rem;">

      
                <div class="card-header text-center">
                    <strong>Mi Perfil</strong>
                </div>

                <!-- Foto -->
                <img src="images/naya.png"
                     class="card-img-top"
                     alt="Foto de perfil">

           
                <ul class="list-group list-group-flush">

                    <li class="list-group-item">
                        <strong>Nombre:</strong> Naya González
                    </li>

                    <li class="list-group-item">
                        <strong>Ciudad:</strong> Bogotá
                    </li>

                    <li class="list-group-item">
                        <strong>Hobby:</strong> Montar bici y hacer Velitas 
                    </li>

                </ul>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
